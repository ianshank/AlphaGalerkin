# AlphaGalerkin CI/CD Pipeline
# Comprehensive testing, linting, and type checking workflow
#
# Stages:
# 1. Lint & Type Check - Code quality validation
# 2. Unit Tests (Fast) - Core functionality without slow/e2e tests
# 3. Unit Tests (Slow) - Long-running tests
# 4. Integration Tests - End-to-end workflow validation
# 5. Coverage Report - Test coverage aggregation with 85% gate

name: CI

on:
  # push: is restricted to POST-MERGE branches only. Every feature/claude/plan/
  # release push with an open PR used to fire this workflow twice -- once as
  # `push`, once as `pull_request` -- into the same concurrency group, where
  # `cancel-in-progress` killed whichever registered first. The loser left ~11
  # `cancelled` check runs stapled to the SHA and `mergeable_state: unstable`,
  # which was mis-triaged as a CI failure twice in one day (B38). Worse, `focus`
  # runs only on pull_request and test-slow's [full-test] hatch only on push, so
  # which gate ran was a scheduler race. `pull_request:` below (unfiltered)
  # covers every PR head; a feature-branch push with NO open PR now gets no CI
  # until a PR exists -- the stated cost.
  #
  # RISK, named: the default branch is hardcoded here because `on:` filters
  # cannot evaluate expressions. If the default branch is renamed, post-merge
  # CI on it silently stops (PR CI is unaffected). The repo's own history has
  # this exact bug once already -- see the comment that used to sit above
  # `pull_request:` and now lives in git blame.
  push:
    branches: [claude/alphagalerkin-implementation-4zGEN, main, master, develop]
  # No branches filter: the repo's default branch is not main/develop, so a
  # [main, develop] filter silently disabled CI for every pull request.
  pull_request:
  schedule:
    - cron: '0 4 * * *'  # Run nightly at 4am UTC
  workflow_dispatch:

# Cancel in-progress runs on new pushes to the same branch.
#
# Keyed on HEAD REPO + HEAD BRANCH, not github.ref, so that the push-triggered
# run and the pull_request-triggered run for the same branch land in the same
# group and dedupe. Without this, any branch matching the push globs above that
# also has an open PR runs the entire pipeline twice per push (github.ref is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request, so the
# two never collided).
#
# The head-repo half is what keeps fork PRs independent: two different forks can
# each have a branch named e.g. "feature/foo", and keying on the branch name
# alone would let unrelated fork runs cancel each other. For a same-repo PR,
# head.repo.full_name equals github.repository, so the push/PR dedup above still
# collapses to one run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege: jobs only need to read the repository (no writes to contents,
# issues, PRs, etc.). Individual jobs can widen this if they ever need to.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "1"
  # Langfuse credentials are intentionally unset in CI; the tracker
  # degrades to a no-op when LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY
  # are absent, so no API keys are required.
  # Set matplotlib to non-interactive backend
  MPLBACKEND: Agg
  # Reproducible builds
  PYTHONHASHSEED: "0"

jobs:
  # ============================================================
  # Stage 1: Lint & Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff: an unpinned install pulls a newer ruff whose default
          # `ruff format` now formats Markdown (the feature graduated from
          # preview), reformatting embedded code blocks in *.md docs and
          # breaking this gate on files unrelated to the change under review.
          # Keep this aligned with the `ruff` pin in pyproject.toml [dev].
          pip install "ruff==0.15.8"
          # Pin mypy + pydantic for plugin compatibility
          pip install "mypy>=1.10,<1.12" "pydantic>=2.7,<2.10"
          # Install minimal deps for type checking
          pip install torch einops jaxtyping hydra-core structlog numpy scipy

      # Scope is exactly the complement of pre-commit's ruff `exclude:`
      # (^(hf_space|notebooks|claude-code-platform)/) — i.e. every tracked *.py
      # is linted by exactly one of the two, with no file lintable by the commit
      # hook but invisible to CI. Verify after changing either side with:
      #   git ls-files '*.py' | grep -vE '^(src/|tests/|dashboard/|scripts/|config/)' \
      #     | grep -vE '^(conftest|deploy_space)\.py$' \
      #     | grep -vE '^(hf_space|notebooks|claude-code-platform)/'
      # (must print nothing). Without parity, code can be CI-green and still be
      # rewritten or rejected by a contributor's commit hook. The three excluded
      # trees are the HF deploy bundle (pinned to an older ruff/gradio, an
      # accepted charter deviation), notebook helpers, and vendored platform code.
      - name: Run Ruff linting
        run: ruff check src/ tests/ dashboard/ scripts/ config/ conftest.py deploy_space.py --output-format=github

      - name: Run Ruff formatting check
        run: ruff format src/ tests/ dashboard/ scripts/ config/ conftest.py deploy_space.py --check

      # F0/F1 screen: an @abstractmethod that every subclass overrides but
      # nothing ever *calls* is dead code — a docstring describing an algorithm
      # that does not run. That is exactly how `PDEGame.get_reward` (F1) and
      # `PDEGame.get_result` (B17) survived. The audit is AST-only (stdlib
      # imports, no torch/numpy), so it runs in this job's minimal dep set.
      #
      # The three refinement roots are clean and gated hard. Every OTHER package
      # is now gated too -- measured clean at the time this was tightened, so it
      # costs nothing today and blocks the next dead abstraction instead of
      # reporting it. `src/backend` alone stays advisory: its 7 unread
      # `BackendInterface` protocol members are the documented domain-PoC
      # backlog (docs/CODE_HYGIENE_AUDIT.md B10), tied to the open JAX
      # keep-or-cut decision.
      #
      # Pass every root in ONE invocation. The audit resolves call sites within
      # the union of the roots it is given, so scanning root-by-root is strictly
      # stricter than scanning them together and would flag cross-package
      # readers as missing -- e.g. `src/training` alone reports
      # `BaseLoss.forward` (losses/base.py) unread, while the combined scan
      # does not, because the reader lives outside that package. Do not "tighten"
      # this by splitting it up.
      # src/research joined these roots when the element-local substrate landed:
      # RefinementSubstrate is declared in src/refinement but its driver
      # (src/research/substrates/sweep.py) lives in src/research, so the
      # narrower scan flagged seven live Protocol members as unread -- exactly
      # the cross-package false positive the comment above warns about. Widening
      # the scan is the honest fix; exempting live members via the script's
      # allowlist would have silently stopped guarding them.
      - name: Audit abstractions (refinement surfaces)
        run: |
          python -m scripts.audit_abstractions \
            src/mcts src/refinement src/pde src/research --fail-on-missing

      - name: Audit abstractions (all packages except the src/backend backlog)
        run: |
          python -m scripts.audit_abstractions \
            $(ls -d src/*/ | grep -v __pycache__ | grep -v 'src/backend/') \
            --fail-on-missing

      - name: Audit abstractions (src/backend, report-only)
        continue-on-error: true
        run: python -m scripts.audit_abstractions src/backend

      - name: Run MyPy type checking
        # Informational gate (continue-on-error). mypy --strict currently reports
        # only a small number of `unused-ignore` diagnostics in training/ +
        # research/, and whether each fires depends on the installed torch version
        # (this lint job pins a minimal dep set that can differ from a local
        # .[dev] env). That makes a hard gate flaky across environments, so mypy
        # stays non-blocking and shields CI from dependency drift; ruff check +
        # format are the hard quality gates. Run `mypy src/ --strict` locally
        # pre-merge (see CLAUDE.md).
        continue-on-error: true
        run: mypy src/ --strict --ignore-missing-imports

  # ============================================================
  # Scope containment (docs/FOCUS.md)
  # ============================================================
  # An owner decision froze two tracks for this cycle (the codec model-zoo, and
  # dashboard/ + its hf_space mirror). A freeze written only in prose is a
  # suggestion; this makes it a check.
  #
  # The rule is NOT "do not touch frozen code" -- a freeze is a pause, not a ban,
  # and this repository's own history shows what deleting too early costs. It is
  # "do not make a *substantive* change to a frozen track in the same changeset
  # as core solver work", because that is what split attention looks like in a
  # diff. "Substantive" is a line budget in config/focus.yaml, so an incidental
  # edit (a version shim, a tree-wide rename) never trips it.
  #
  # A separate job rather than a step in `lint` for one concrete reason:
  # `git diff <base>...<head>` needs the merge base, and `lint`'s checkout is
  # deliberately shallow (fetch-depth 1). Deepening it would slow every step in
  # that job to serve one check.
  #
  # NOT in `ci-success`'s needs list, deliberately and temporarily -- the same
  # convention the `secrets` job above documents. It was verified clean against
  # this branch's own diff before landing, and it is mutation-tested (8/8), but
  # a brand-new gate promoted into someone's merge path by the same pull request
  # that introduces it gives a first red no way to be triaged. Promote it into
  # the merge gate once it has been green across a few pull requests. Leaving
  # that unsaid would make its absence look like an oversight.
  focus:
    name: Scope Containment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful on a pull request: on a plain push there is no base branch
    # to diff against, so there is no changeset to classify.
    #
    # The `focus-override` label is the escape hatch for a genuinely coupled
    # change. It is deliberately a *visible* one -- an override nobody can see
    # is the same as no gate.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'focus-override')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the check diffs against the merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        # The checker is stdlib + pyyaml + pydantic by design, so this job stays
        # seconds rather than minutes.
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.7,<2.10" pyyaml

      - name: Check scope containment
        run: |
          set -euo pipefail
          # `actions/checkout` with fetch-depth 0 normally populates
          # refs/remotes/origin/*, but a fork or a changed fetch spec can leave
          # the base branch unfetched. Falling back to the SHA the event itself
          # carried means the check reports a real verdict instead of a git
          # error that reads like a harness problem.
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          echo "Diffing against base: $BASE"
          python -m scripts.check_focus --base "$BASE" --head HEAD --fail-on-violation

  # ============================================================
  # Stage 2: Unit Tests (Fast)
  # ============================================================
  # .gitleaks.toml has existed since the repo was set up, and `make gitleaks`
  # has existed alongside it -- but NOTHING ever invoked either. A secret
  # scanner that never runs is worse than none: its presence in the tree reads
  # as coverage.
  #
  # This is a JOB, not a step in test-fast, for two reasons found the hard way
  # when it was a step:
  #   1. test-fast is a 3-way python matrix, so the scan ran three times per
  #      push -- redundant work and three copies of any failure.
  #   2. actions/checkout defaults to fetch-depth 1. gitleaks-action does a
  #      diff scan against the base commit, which a shallow clone does not
  #      contain, so `git` failed with "Use '--' to separate paths from
  #      revisions", the scan covered ~0 bytes, and it still logged "no leaks
  #      found in partial scan" before exiting 1. A scanner reporting a clean
  #      result over zero bytes is precisely the failure mode this branch keeps
  #      correcting; `fetch-depth: 0` gives it the history it needs to scan
  #      anything at all.
  #
  # Scope: the config allowlists all of tests/, docs/ and config/baselines/, so
  # this covers src/, scripts/ and .github/ and deliberately not fixtures.
  # Narrowing that allowlist is tracked separately -- widening the scan and
  # wiring it in one change makes a first run's failures impossible to triage.
  #
  # NOT in `ci-success`'s needs list, deliberately and temporarily: this job has
  # never completed a green run, and its first attempt failed for a harness
  # reason rather than a finding. It reports now and blocks later -- promote it
  # into the merge gate once it has been green across a few pushes. Leaving that
  # unsaid would make its absence look like an oversight.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test-fast:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e ".[dev]"
          # Safety-net: ensure core scientific/ML deps are present even if
          # the editable install partially failed (can happen with complex
          # dependency graphs on older pip resolvers).
          python -c "import einops, jaxtyping, gradio" 2>/dev/null || \
            pip install "einops>=0.7.0" "jaxtyping>=0.2.25" "gradio>=6.0.0"

      - name: Show installed package versions
        run: |
          python -c "import sys; print('Python', sys.version)"
          pip list --format=columns | grep -E "gradio|anyio|pydantic|hypothesis|torch|numpy|scipy|Pillow|einops|jaxtyping|matplotlib"

      # The .claude/ harness -- 9 skills, 5 subagents, 4 slash commands, a
      # SessionStart hook and settings.json -- is executable configuration with
      # no tests until now. A skill citing a deleted path, an agent declaring a
      # tool that does not exist, or a permission naming a renamed module all
      # fail at the moment someone relies on them. Hermetic and deterministic:
      # no network, no model calls, ~0.25s.
      - name: Validate .claude harness
        run: |
          pytest tests/claude/ \
            --tb=short \
            -q

      # Explicit, named gate for the whole security suite. The broad
      # "Run fast unit tests" step below does collect tests/security/, but only
      # while every file there stays free of the slow/e2e markers it filters out,
      # and a failure there is buried among ~9000 tests. Running the directory on
      # its own keeps the signal legible and pins the suite in place: 69 tests,
      # ~52s, no GPU, no network, no optional dependencies. (Measured 2026-08-21;
      # the "33 tests, <1s" this replaced was written before rounds 3-4 more than
      # doubled the suite, and was never re-measured. The count went 71 -> 69 when
      # test_security_model.py was deleted: its three tests patched torch.load,
      # called it in the test body, and asserted the mock recorded the arguments
      # the test had just passed -- zero src imports, verified green in a
      # directory containing no src/ at all.)
      - name: Run security test suite
        run: |
          pytest tests/security/ \
            -m "not gpu_required" \
            --tb=short \
            -q

      # tests/demos/ and tests/notebooks/ are --ignore'd from the broad run below
      # (they are slower than a unit test and would blur that step's signal), and
      # until now they were named in NO other step -- so 226 tests, 151 + 75,
      # never executed in CI at all. tests/demos was already flagged as a known
      # gap in docs/CODE_HYGIENE_AUDIT.md; tests/notebooks was documented nowhere.
      #
      # Given their own step they cost ~2 min and keep the fast lane fast. Same
      # shape as the security step above: a named directory, legible on failure.
      #
      # tests/e2e/ used to be named here as a KNOWN gap, on the grounds that
      # test_quick_validation_journey.py::test_train_physics_minimal "shells out
      # with a fixed 120 s timeout and fails on a loaded machine". That
      # attribution was wrong: the run was never minimal (--train-size is the
      # grid side, not the sample count, so it built the default 5000 samples and
      # needed ~1.7 h), so no budget could have made it pass. Bounding the sample
      # counts fixed it -- measured 15 s. The directory now has its own `test-e2e`
      # job below, blocking in ci-success, and tests/docs/test_e2e_visibility.py
      # fails the build if it is ever silently un-wired again.
      - name: Run demo and notebook suites
        run: |
          pytest tests/demos/ tests/notebooks/ \
            -m "not gpu_required" \
            --tb=short \
            -q

      - name: Run fast unit tests
        run: |
          pytest tests/ \
            -m "not slow and not e2e and not gpu_required" \
            --tb=short \
            --ignore=tests/e2e/ \
            --ignore=tests/integration/ \
            --ignore=tests/demos/ \
            --ignore=tests/training/test_extended_config.py \
            --ignore=tests/notebooks/ \
            --ignore=tests/distributed/test_multiprocess.py \
            --deselect=tests/data/test_dataset.py::TestReplayDataset::test_iteration_with_dataloader \
            --deselect=tests/data/test_dataset.py::TestExperienceListDataset::test_with_dataloader \
            --deselect=tests/data/test_dataset.py::TestDatasetIntegration::test_batch_sampler_with_list_dataset \
            --deselect=tests/experiments/test_physics_loss.py::TestPhysicsLossComputeLaplacian::test_laplacian_of_linear \
            --deselect=tests/games/test_chess.py::TestChessEdgeCases::test_invalid_move_notation \
            --deselect=tests/games/test_chess.py::TestChessEdgeCases::test_illegal_move_notation \
            --deselect=tests/mcts/test_node.py::TestPruneExcept::test_prune_except_returns_child \
            --deselect=tests/mcts/test_search.py::TestMCTSTreeManagement::test_advance_reuses_subtree \
            --deselect=tests/training/test_self_play.py::TestParallelSelfPlayWorker::test_generate_games_sequential_fallback_on_error \
            -q 2>&1 | tee /tmp/pytest-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: /tmp/pytest-output.txt
          retention-days: 7

  # ============================================================
  # Stage 3: Unit Tests (Slow) - Only on the default branch, nightly, or explicit
  # ============================================================
  test-slow:
    name: Unit Tests (Slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-fast
    # workflow_dispatch added 2026-09-02: the [full-test] commit-message hatch reads
    # github.event.head_commit, which only `push` payloads carry, and push: is now
    # restricted to post-merge branches -- so on a feature branch the hatch is dead.
    # A manual dispatch works on any branch and replaces it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || contains(github.event.head_commit.message, '[full-test]') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow unit tests
        run: |
          pytest tests/ \
            -m "slow and not gpu_required" \
            --tb=short \
            -x \
            -q

  # ============================================================
  # Stage 4: Integration Tests
  # ============================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-fast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ tests/training/ \
            -m "not gpu_required" \
            --tb=short \
            -q

  # ============================================================
  # Stage 4b: End-to-End Journeys
  # ------------------------------------------------------------
  # tests/e2e/ was excluded from every step in this workflow except one chess
  # smoke: the fast lane passes BOTH --ignore=tests/e2e/ and -m "not e2e", and
  # the `coverage` job repeats both. 11 test files, 81 tests, one of them named
  # anywhere. That is the same invisibility that hid tests/demos + tests/notebooks
  # (226 tests) until 18f533d and src/backend (213 tests) until 2026-09-02 --
  # each found by a person reading this file, never by a check.
  #
  # Measured on a 4-CPU container: the whole directory is 130-310 s, so it fits
  # this cap with ~6x headroom.
  #
  # E2E_DEVICE is set EXPLICITLY rather than left to default "auto": a runner
  # that grows a GPU would otherwise silently change what this job measures.
  # See tests/e2e/conftest.py for the contract; the same suite runs unchanged on
  # a CUDA host with E2E_DEVICE=cuda (which FAILS LOUD, at collection, if CUDA
  # turns out to be absent).
  #
  # fem_required E2E is excluded here and selected positively in test-extras --
  # the only job that installs the [fem] extra. Excluding it in both places is
  # the invisibility bug this job exists to fix, so
  # tests/docs/test_e2e_visibility.py asserts that positive selection exists.
  test-e2e:
    name: E2E Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-fast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # SPLIT INTO TWO INVOCATIONS -- a workaround for a PRE-EXISTING leak, not a
      # fix, and labelled as one. Running the tier as a single process is what
      # first exposed it (nothing had ever run this directory whole): the pytest
      # PARENT climbs monotonically and never releases, and the run dies. On
      # this runner it failed with "The runner has received a shutdown signal"
      # after a 4-minute stall on nine trivial config tests; locally it was
      # OOM-killed (SIGKILL, exit 137) twice at a 13.6 GB peak.
      #
      # Measured, which is what picked the split point: the parent holds flat at
      # 594 MB through the subprocess-driven journeys and jumps the moment the
      # in-process `test_chess_engine_e2e.py` starts. Splitting there caps each
      # process at a fraction of the whole:
      #
      #     -k "not chess"   103 passed + 1 xfailed, 3:21, peak 1,451 MB
      #     -k "chess"        32 passed,             0:54, peak 3,614 MB
      #     (single process)  died,                        peak 13,649 MB
      #
      # The partition is exhaustive by construction (X and not-X), and
      # tests/docs/test_e2e_visibility.py asserts the pair is complete, so
      # deleting one step cannot silently retire half the tier.
      #
      # Root-causing the leak is chess/MCTS work, not E2E-test work; see
      # docs/E2E_TEST_PLAN.md section 12.4. When it is fixed, collapse these two
      # steps back into one and delete the partition constant in that guard.
      # E2E_TIMEOUT_SCALE: the three subprocess budgets (30/60/120 s) were
      # measured on an idle box. Under concurrent load the same children take
      # multiples of that -- measured locally at load ~4.4, a `poc.cli run` that
      # takes 7 s idle took 56 s, i.e. 4 s inside its 60 s budget, and a 105 s
      # training child exceeded 120 s. A shared GitHub runner is not idle, and
      # this job is in `ci-success.needs`, so a load spike would fail the build
      # for a reason that is not a defect. The scale multiplies the budgets; it
      # does not disable them, so a genuinely hung child is still caught.
      # This is the same load-sensitivity class CLAUDE.md records for
      # `tests/benchmarks/` -- recorded there, mitigated here.
      - name: Run E2E journeys (excluding the chess suites)
        env:
          E2E_DEVICE: cpu
          E2E_TIMEOUT_SCALE: "3"
        run: |
          pytest tests/e2e/ \
            -m "not gpu_required and not fem_required" \
            -k "not chess" \
            --tb=short \
            -q

      - name: Run E2E journeys (chess suites, separate process)
        env:
          E2E_DEVICE: cpu
          E2E_TIMEOUT_SCALE: "3"
        run: |
          pytest tests/e2e/ \
            -m "not gpu_required and not fem_required" \
            -k "chess" \
            --tb=short \
            -q

  # ============================================================
  # Stage 5: Coverage Report (85% global gate)
  # ============================================================
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    # 45, not 30: this job runs the whole test sweep under the pure-Python
    # tracer, which measured ~35 minutes on a GitHub runner.
    #
    # The ~40 per-module gates that used to run here were split into the
    # `coverage-gates` job on 2026-09-02, after this job hit the 45-minute cap
    # at 54 minutes and was cancelled with all 47 of its steps already
    # successful -- failing `ci-success` on work that had actually completed.
    # Raising the cap was rejected as masking: the job was 20% over budget and
    # grew with every gate added. Keep new whole-suite work out of here.
    timeout-minutes: 45
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov matplotlib

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -m "not slow and not e2e and not gpu_required" \
            --ignore=tests/e2e/ \
            --ignore=tests/integration/ \
            --ignore=tests/demos/ \
            --ignore=tests/training/test_extended_config.py \
            --ignore=tests/notebooks/ \
            --ignore=tests/distributed/test_multiprocess.py \
            --deselect=tests/data/test_dataset.py::TestReplayDataset::test_iteration_with_dataloader \
            --deselect=tests/data/test_dataset.py::TestExperienceListDataset::test_with_dataloader \
            --deselect=tests/data/test_dataset.py::TestDatasetIntegration::test_batch_sampler_with_list_dataset \
            --deselect=tests/experiments/test_physics_loss.py::TestPhysicsLossComputeLaplacian::test_laplacian_of_linear \
            --deselect=tests/games/test_chess.py::TestChessEdgeCases::test_invalid_move_notation \
            --deselect=tests/games/test_chess.py::TestChessEdgeCases::test_illegal_move_notation \
            --deselect=tests/mcts/test_node.py::TestPruneExcept::test_prune_except_returns_child \
            --deselect=tests/mcts/test_search.py::TestMCTSTreeManagement::test_advance_reuses_subtree \
            --deselect=tests/training/test_self_play.py::TestParallelSelfPlayWorker::test_generate_games_sequential_fallback_on_error \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-alphagalerkin
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ============================================================
  # Stage 5b: Per-module coverage gates
  # ============================================================
  # Split out of `coverage` on 2026-09-02 because that job hit its
  # timeout-minutes: 45 at 54 minutes and was cancelled -- with ALL 47 of its
  # steps having already succeeded, which then failed `ci-success` on a job
  # whose work was actually done. The split is the fix rather than a larger
  # timeout: the whole-suite sweep was ~35 min and these gates ~17.5 min, so
  # raising the cap would have masked a job 20% over budget that grows with
  # every gate added. These steps re-run their own test subsets and consume no
  # artifact from the sweep, so they parallelise with it for free.
  #
  # Still true, and still the real fix (docs/CODE_HYGIENE_AUDIT.md 7.7): several
  # gates re-run files the sweep already covered. Collapsing that duplication so
  # each file is measured once would shrink both halves.
  coverage-gates:
    name: Per-Module Coverage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov matplotlib

      # Per-module coverage gates — ratcheted up as part of tech-debt reduction.
      # Each gate ensures no single subsystem regresses below its threshold.
      - name: Per-module coverage gate (pde)
        if: always() && hashFiles('tests/pde/') != ''
        run: |
          pytest tests/pde/ --cov=src/pde --cov-fail-under=85 -q --no-header

      # First per-module gate for the MCTS engine (branch): it was previously
      # covered only by the global --cov=src gate, and it is now known to have
      # contained a correctness bug (single-agent backup, F0). Branch coverage
      # is currently 96%.
      - name: Per-module coverage gate (mcts)
        if: always() && hashFiles('tests/mcts/') != ''
        run: |
          pytest tests/mcts/ --cov=src/mcts --cov-branch --cov-fail-under=90 -q --no-header

      # Domain-free refinement engine (WS1). Branch coverage 100% (170 stmts,
      # 12 branches, 0 missed; re-measured 2026-09-02). The 96% previously
      # stated here predated Slice A's substrate.py/substrate_registry.py.
      - name: Per-module coverage gate (refinement)
        if: always() && hashFiles('tests/refinement/') != ''
        run: |
          pytest tests/refinement/ --cov=src/refinement --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (modeling)
        if: always() && hashFiles('tests/modeling/') != ''
        run: |
          pytest tests/modeling/ --cov=src/modeling --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (training)
        if: always() && hashFiles('tests/training/') != ''
        run: |
          pytest tests/training/ --cov=src/training --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (training/operator_trainer)
        if: always() && hashFiles('tests/test_operator_training.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/training/operator_trainer.py" \
            -m pytest tests/test_operator_training.py \
            tests/security/test_checkpoint_roundtrip.py::TestOperatorTrainerRoundTrip -q -p no:cov
          python -m coverage report --include="*/src/training/operator_trainer.py" --fail-under=85

      - name: Per-module coverage gate (research)
        if: always() && hashFiles('tests/research/') != ''
        run: |
          pytest tests/research/ --cov=src/research --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (games)
        if: always() && hashFiles('tests/games/') != ''
        run: |
          pytest tests/games/ --cov=src/games --cov-fail-under=80 -q --no-header

      - name: Per-module coverage gate (distributed)
        if: always() && hashFiles('tests/distributed/') != ''
        run: |
          pytest tests/distributed/ --cov=src/distributed --cov-fail-under=60 -q --no-header

      - name: Per-module coverage gate (physics)
        if: always() && hashFiles('tests/physics/') != ''
        run: |
          pytest tests/physics/ --cov=src/physics --cov-fail-under=75 -q --no-header

      # Gates previously documented in CLAUDE.md's Regression Surface table but
      # never wired into CI. Each mirrors the documented Verification command.
      - name: Per-module coverage gate (alphagalerkin)
        if: always() && hashFiles('tests/alphagalerkin/') != ''
        run: |
          pytest tests/alphagalerkin/ --cov=src/alphagalerkin --cov-fail-under=85 -q --no-header

      # CAUTION: never mix file-path --cov=path/to/module.py specs into a
      # pytest-cov invocation. Under coverage 7.x / pytest-cov 7.x, file-path
      # specs are silently dropped (only a CoverageWarning, slug
      # module-not-imported), so the gate
      # passes on the remaining directory spec alone. This gate previously
      # carried two file specs that enforced nothing; they now run below as a
      # separate native-runner step (path-glob --include), the same pattern as
      # the scaling_law/agents/transfer/stochastic gates.
      - name: Per-module coverage gate (integrations/lm_studio)
        if: always() && hashFiles('tests/integrations/') != ''
        run: |
          pytest tests/integrations tests/poc/test_llm_prior_ablation_config.py \
            tests/poc/test_llm_prior_ablation_scenario.py -m "not gpu_required" \
            --cov=src/integrations/lm_studio \
            --cov-branch --cov-fail-under=85 -q --no-header

      # Gated at 79, not 85: with the file specs silently dropped, this surface
      # decayed unenforced — measured today at 81 combined branch
      # (llm_prior_ablation.py 77, llm_prior_config.py 100) vs the documented 86,
      # which is not reproducible under branch measurement with the documented
      # test selection. 79 = measured − 2. Ratcheting back toward 85+ is tracked
      # in docs/CODE_HYGIENE_AUDIT.md.
      - name: Per-module coverage gate (poc/llm_prior scenario modules)
        if: always() && hashFiles('tests/poc/test_llm_prior_ablation_scenario.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/poc/scenarios/llm_prior_ablation.py,*/src/poc/scenarios/llm_prior_config.py" \
            -m pytest tests/integrations tests/poc/test_llm_prior_ablation_config.py \
            tests/poc/test_llm_prior_ablation_scenario.py -m "not gpu_required" -q -p no:cov
          python -m coverage report \
            --include="*/src/poc/scenarios/llm_prior_ablation.py,*/src/poc/scenarios/llm_prior_config.py" \
            --fail-under=79

      - name: Per-module coverage gate (integrations/openai_compat)
        if: always() && hashFiles('tests/integrations/test_backend_registry.py') != ''
        run: |
          pytest tests/integrations/test_backend_registry.py \
            --cov=src/integrations/openai_compat --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (poc/baselines)
        if: always() && hashFiles('tests/poc/test_scenario_baselines.py') != ''
        run: |
          pytest tests/poc/test_scenario_baselines.py tests/poc/test_cli_baselines.py \
            tests/poc/test_baseline_cli_support.py \
            --cov=src/poc/baselines --cov-branch --cov-fail-under=85 -q --no-header

      # NOTE: these two gates use the native coverage runner with path-glob
      # --include rather than pytest-cov's dotted --cov=module.path. The dotted
      # form makes coverage import the target module during tracer setup, which
      # collides with the torch C extension (SystemError: bad call flags) under
      # every tracer, pure-Python included -- so it is not a tracer choice that
      # fixes it. The native runner with path globs measures the same modules
      # without importing them for source discovery.
      - name: Per-module coverage gate (poc/scaling_law + centaur-common)
        if: always() && hashFiles('tests/poc/test_scaling_law_scenario.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/poc/scenarios/scaling_law.py,*/src/poc/scenarios/scaling_law_config.py,*/src/poc/scenarios/_centaur_common.py" \
            -m pytest tests/poc/test_scaling_law_config.py tests/poc/test_scaling_law_scenario.py \
            tests/poc/test_centaur_common.py -q -p no:cov
          python -m coverage report \
            --include="*/src/poc/scenarios/scaling_law.py,*/src/poc/scenarios/scaling_law_config.py,*/src/poc/scenarios/_centaur_common.py" \
            --fail-under=85

      - name: Per-module coverage gate (agents/research_loop + config)
        if: always() && hashFiles('tests/agents/test_research_loop.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/agents/research_loop.py,*/src/agents/config.py" \
            -m pytest tests/agents/test_research_loop.py tests/agents/test_config.py -q -p no:cov
          python -m coverage report \
            --include="*/src/agents/research_loop.py,*/src/agents/config.py" \
            --fail-under=85

      # Path-glob --include (not dotted --cov) to avoid the torch C-extension
      # collision during tracer source discovery, matching the two gates above.
      - name: Per-module coverage gate (transfer_baseline_compare)
        if: always() && hashFiles('tests/research/test_transfer_baseline_compare.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/research/transfer_baseline_compare.py,*/src/experiments/cnn_baseline.py,*/src/poc/scenarios/transfer_baseline_compare.py,*/src/poc/scenarios/transfer_baseline_compare_config.py" \
            -m pytest tests/research/test_transfer_baseline_compare.py \
            tests/poc/test_transfer_baseline_compare_config.py \
            tests/poc/test_transfer_baseline_compare_scenario.py \
            tests/experiments/test_cnn_baseline.py -q -p no:cov
          python -m coverage report \
            --include="*/src/research/transfer_baseline_compare.py,*/src/experiments/cnn_baseline.py,*/src/poc/scenarios/transfer_baseline_compare.py,*/src/poc/scenarios/transfer_baseline_compare_config.py" \
            --fail-under=85

      # Path-glob --include (not dotted --cov) to avoid the torch C-extension
      # collision during tracer source discovery, matching the gates above.
      - name: Per-module coverage gate (stochastic Galerkin / NKE layer)
        if: always() && hashFiles('tests/pde/stochastic/') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/pde/stochastic/*,*/src/research/stochastic_galerkin_compare.py,*/src/poc/scenarios/stochastic_galerkin_compare.py,*/src/poc/scenarios/stochastic_galerkin_compare_config.py" \
            -m pytest tests/pde/stochastic \
            tests/research/test_stochastic_galerkin_compare.py \
            tests/poc/test_stochastic_galerkin_compare_config.py \
            tests/poc/test_stochastic_galerkin_compare_scenario.py \
            tests/scripts/test_run_stochastic_galerkin_compare.py \
            tests/regression/test_related_work_guard.py -q -p no:cov
          python -m coverage report \
            --include="*/src/pde/stochastic/*,*/src/research/stochastic_galerkin_compare.py,*/src/poc/scenarios/stochastic_galerkin_compare.py,*/src/poc/scenarios/stochastic_galerkin_compare_config.py" \
            --fail-under=85

      # The three gates below were documented in CLAUDE.md's Regression Surface
      # table but never wired into CI (phantom gates, audit backlog B20). All use
      # the native runner: their documented commands carry file-path or dotted
      # --cov specs, both of which fail under the installed coverage stack (see
      # the CAUTION note on the lm_studio gate and the torch-collision note above).
      - name: Per-module coverage gate (noyron_basis v2.2)
        if: always() && hashFiles('tests/poc/test_noyron_basis_scenario.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/poc/scenarios/noyron_basis.py,*/src/poc/scenarios/noyron_basis_config.py" \
            -m pytest tests/poc/test_noyron_basis_config.py \
            tests/poc/test_noyron_basis_scenario.py -m "not gpu_required" -q -p no:cov
          python -m coverage report \
            --include="*/src/poc/scenarios/noyron_basis.py,*/src/poc/scenarios/noyron_basis_config.py" \
            --fail-under=85

      - name: Per-module coverage gate (Noyron HX surface)
        if: always() && hashFiles('tests/poc/test_noyron_hx_scenario.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/pde/sdf.py,*/src/pde/geometry_picogk.py,*/src/poc/scenarios/noyron_hx.py,*/src/poc/config_noyron.py" \
            -m pytest tests/pde/test_sdf.py tests/pde/test_picogk_domain.py \
            tests/poc/test_noyron_hx_scenario.py -q -p no:cov
          python -m coverage report \
            --include="*/src/pde/sdf.py,*/src/pde/geometry_picogk.py,*/src/poc/scenarios/noyron_hx.py,*/src/poc/config_noyron.py" \
            --fail-under=85

      - name: Per-module coverage gate (SBIR P40 surface)
        if: always() && hashFiles('tests/scripts/test_run_sbir_p40.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/research/gpu_profiler.py,*/src/research/baselines.py,*/src/research/pde_benchmarks.py,*/src/poc/device.py" \
            -m pytest tests/research/test_baselines.py tests/research/test_pinn_device.py \
            tests/research/test_gpu_profiler.py tests/research/test_pde_benchmarks.py \
            tests/research/test_ns_baseline.py tests/pde/test_taylor_green_invariants.py \
            tests/scripts/test_run_sbir_p40.py -q -p no:cov
          python -m coverage report \
            --include="*/src/research/gpu_profiler.py,*/src/research/baselines.py,*/src/research/pde_benchmarks.py,*/src/poc/device.py" \
            --fail-under=85

      # Phase-2c (B20 close-out, docs/CODE_HYGIENE_AUDIT.md §7.4): six packages
      # that previously rode only the global 85% gate. Each threshold is
      # floor(measured branch %) - 2, capped at 85 on first landing, per the
      # add-coverage-gate skill. Measured 2026-08-15:
      #   agents 95.42 -> 85 (capped) | tools 91.86 -> 89 | experiments 89.76 -> 87
      #   curriculum 89.06 -> 87 | engines 84.26 -> 82 | data 79.81 -> 77
      - name: Per-module coverage gate (agents)
        if: always() && hashFiles('tests/agents/') != ''
        run: |
          pytest tests/agents/ --cov=src/agents --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (tools)
        if: always() && hashFiles('tests/tools/') != ''
        run: |
          pytest tests/tools/ --cov=src/tools --cov-branch --cov-fail-under=89 -q --no-header

      - name: Per-module coverage gate (experiments)
        if: always() && hashFiles('tests/experiments/') != ''
        run: |
          pytest tests/experiments/ --cov=src/experiments --cov-branch --cov-fail-under=87 -q --no-header

      - name: Per-module coverage gate (curriculum)
        if: always() && hashFiles('tests/curriculum/') != ''
        run: |
          pytest tests/curriculum/ --cov=src/curriculum --cov-branch --cov-fail-under=87 -q --no-header

      - name: Per-module coverage gate (engines)
        if: always() && hashFiles('tests/engines/') != ''
        run: |
          pytest tests/engines/ --cov=src/engines --cov-branch --cov-fail-under=82 -q --no-header

      # Raised 77 -> 85 (2026-08-21). The 77 was set against a documented 79.81%
      # whose stated drag was physics_dataset.py at 23%; that file now measures
      # 100% and the package measures 97.83%, so 77 had 20 points of slack and
      # would not have caught a large regression.
      - name: Per-module coverage gate (data)
        if: always() && hashFiles('tests/data/') != ''
        run: |
          pytest tests/data/ --cov=src/data --cov-branch --cov-fail-under=85 -q --no-header

      # Five packages that had no gate at all. Measured 2026-08-21 under the
      # since-retired COVERAGE_CORE=pytrace pin; re-measured identical without
      # it (see the tracer-retirement entry in CHANGELOG.md). --cov-branch is
      # redundant with pyproject.toml's `[tool.coverage.run] branch = true` and
      # is kept only for symmetry with the gates above.
      #
      # Gated at floor(measured)-2 capped at 85, the convention documented on the
      # src/agents row in CLAUDE.md. The cap is deliberate for a NEW gate: its job
      # is to stop a package falling below the repo's global standard, not to
      # freeze it at today's number, where an unrelated change would ratchet it
      # red. (src/tools at 89 is the standing exception, not the rule.)
      #
      #   src/poc          89.57%  -> 85   (4011 stmts, the largest ungated surface;
      #                                     its seven per-file gates cover 17 of 41
      #                                     files -- runner.py, cli.py, results.py and
      #                                     scenarios/transfer.py at 25% had none)
      #   src/analysis     91.08%  -> 85
      #   src/tournament   92.91%  -> 85
      #   src/prototyping  93.16%  -> 85
      #   src/demos        83.28%  -> 81   (below the cap, so floor(measured)-2 applies)
      - name: Per-module coverage gate (poc)
        if: always() && hashFiles('tests/poc/') != ''
        run: |
          pytest tests/poc/ -m "not gpu_required" \
            --cov=src/poc --cov-branch --cov-fail-under=85 -q --no-header

      # B20 close-out (docs/CODE_HYGIENE_AUDIT.md §7.4): five surfaces that
      # previously rode only the whole-package `src/poc` gate above (and, for
      # constants.py/seeding.py, only the global 85% `--cov=src` gate) with no
      # gate of their own -- a regression in any one of them could be masked
      # by high coverage elsewhere in the same package/tree. Each threshold is
      # floor(measured branch %) - 2, capped at 85, the same convention as
      # every other gate in this job. Measured 2026-08-24 (after closing the
      # non-GPU-only gaps found while adding these gates -- see below):
      #   src/poc/cli.py                                  99%   -> 85 (capped)
      #   src/poc/visualization/*                        100%   -> 85 (capped)
      #   scenarios/{transfer,complexity,stability}.py     94%   -> 85 (capped)
      #   src/constants.py                                100%   -> 85 (capped)
      #   src/seeding.py                                  100%   -> 85 (capped)
      #
      # cli.py's cmd_eval_harness (previously 0% -- entirely untested) and the
      # demo/log-level, metrics-truncation, non-dict-JSON, missing-metric-diff
      # branches are now covered (tests/poc/test_cli_eval_harness.py + additions
      # to test_cli_commands.py/test_cli_demo_export.py/test_cli_baselines.py).
      # visualization/plots.py's pareto_frontier plot (previously entirely
      # untested) and the training_curves dual-axis + comparison_boxplot
      # matplotlib-fallback branches are now covered (tests/poc/test_visualization.py).
      # scenarios/transfer.py's execute()/_train_model()/_evaluate_at_resolution()/
      # _save_model() were previously 0% (measured 25% branch on the whole file,
      # the single largest gap this pass found) -- now exercised by a real CPU
      # micro-run in tests/poc/test_transfer_scenario.py (small 9x9/13x13 model,
      # completes in a few seconds). complexity.py/stability.py needed no new
      # tests: their remaining gaps are GPU-only branches (`torch.cuda.is_available()`
      # / `.type == "cuda"`) or defensive `if self._scenario_logger:` checks that
      # are always true after `setup()` in every real call path.
      #
      # Single-file targets (cli.py, constants.py, seeding.py) use the native
      # coverage runner with path-glob --include, not pytest-cov's --cov=path.py
      # or dotted --cov=module.path: coverage 7.x silently drops bare file-path
      # specs (see the lm_studio gate's CAUTION comment above), and the dotted
      # form crashes on import here with the same torch C-extension collision
      # documented on the scaling_law/agents/transfer_baseline_compare gates
      # below (`SystemError: ... bad call flags` inside `torch._C`) -- verified
      # empirically while wiring this gate. visualization/ is a real directory
      # with no torch-import-order collision, so it uses the simpler --cov=DIR
      # form like most other per-package gates.
      - name: Per-module coverage gate (poc/cli)
        if: always() && hashFiles('tests/poc/test_cli_commands.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/poc/cli.py" \
            -m pytest tests/poc/test_cli_commands.py tests/poc/test_cli_demo_export.py \
            tests/poc/test_cli_baselines.py tests/poc/test_cli_eval_harness.py -q -p no:cov
          python -m coverage report --include="*/src/poc/cli.py" --fail-under=85

      - name: Per-module coverage gate (poc/visualization)
        if: always() && hashFiles('tests/poc/test_visualization.py') != ''
        run: |
          pytest tests/poc/visualization tests/poc/test_visualization.py \
            tests/poc/test_reports_coverage.py \
            --cov=src/poc/visualization --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (poc/scenarios classic - transfer, complexity, stability)
        if: always() && hashFiles('tests/poc/test_transfer_scenario.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/poc/scenarios/transfer.py,*/src/poc/scenarios/complexity.py,*/src/poc/scenarios/stability.py" \
            -m pytest tests/poc/test_transfer_scenario.py tests/poc/test_complexity_scenario.py \
            tests/poc/test_stability_scenario.py -q -p no:cov
          python -m coverage report \
            --include="*/src/poc/scenarios/transfer.py,*/src/poc/scenarios/complexity.py,*/src/poc/scenarios/stability.py" \
            --fail-under=85

      - name: Per-module coverage gate (constants)
        if: always() && hashFiles('tests/test_constants.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/constants.py" \
            -m pytest tests/test_constants.py tests/modeling/test_constants_wiring.py -q -p no:cov
          python -m coverage report --include="*/src/constants.py" --fail-under=85

      - name: Per-module coverage gate (seeding)
        if: always() && hashFiles('tests/test_seeding.py') != ''
        run: |
          python -m coverage run --branch \
            --include="*/src/seeding.py" \
            -m pytest tests/test_seeding.py -q -p no:cov
          python -m coverage report --include="*/src/seeding.py" --fail-under=85

      - name: Per-module coverage gate (analysis)
        if: always() && hashFiles('tests/analysis/') != ''
        run: |
          pytest tests/analysis/ --cov=src/analysis --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (tournament)
        if: always() && hashFiles('tests/tournament/') != ''
        run: |
          pytest tests/tournament/ --cov=src/tournament --cov-branch --cov-fail-under=85 -q --no-header

      - name: Per-module coverage gate (prototyping)
        if: always() && hashFiles('tests/prototyping/') != ''
        run: |
          pytest tests/prototyping/ --cov=src/prototyping --cov-branch --cov-fail-under=85 -q --no-header

      # src/backend was invisible to EVERY coverage gate in this repo until
      # 2026-09-02: `src/backend/*` is in pyproject.toml's global
      # `[tool.coverage.run] omit` AND it had no per-module gate, so its 213
      # passing tests measured nothing anywhere. The omit's origin is legitimate
      # -- jax_backend.py needs the optional [jax] extra -- but it was applied at
      # *package* granularity, which also hid torch_backend.py (95%),
      # interface.py (100%), types.py (100%), and, less comfortably, logging.py
      # and rng.py at literally 0%. Same inline-coveragerc technique as demos /
      # video_compression, dropping the omit for this step only. Gated at 54 =
      # floor(measured 56) - 2, measured in THIS lane (no JAX installed, so the
      # 118 jax_backend tests skip); the test-jax job covers the other lane.
      - name: Per-module coverage gate (backend)
        if: always() && hashFiles('tests/backend/') != ''
        run: |
          cat > .coveragerc.backend <<'COVEOF'
          [run]
          branch = true

          [report]
          show_missing = true
          COVEOF
          pytest tests/backend/ \
            --cov=src/backend --cov-config=.coveragerc.backend \
            --cov-branch --cov-fail-under=54 -q --no-header

      # src/core (the Protocols + registry extracted in the 2026-08-16 sprint) had
      # no gate and rode only the global --cov=src. Measured 97.67% branch; gated
      # 85 per the floor(measured)-2-capped-at-85 convention.
      - name: Per-module coverage gate (core)
        if: always() && hashFiles('tests/core/') != ''
        run: |
          pytest tests/core/ --cov=src/core --cov-branch --cov-fail-under=85 -q --no-header

      # src/deployment (ONNX export / quantization / runtime) had no gate. Measured
      # 27.91% branch -- 626 statements, 416 missed. 25 is a REGRESSION TRIPWIRE,
      # not a standard: it stops the package sliding further while it is the
      # largest genuinely under-tested surface in src/. Raising it is real test
      # work, tracked in docs/CODE_HYGIENE_AUDIT.md, not a number to edit here.
      - name: Per-module coverage gate (deployment)
        if: always() && hashFiles('tests/deployment/') != ''
        run: |
          pytest tests/deployment/ --cov=src/deployment --cov-branch --cov-fail-under=25 -q --no-header

      # src/demos hits the same pyproject.toml `[tool.coverage.run] omit` collision
      # that src/video_compression needed a workaround for: a bare --cov=src/demos
      # reports 0.00% with `CoverageWarning: No data was collected`, which is the
      # false-pass failure mode a gate must not have. Same inline-coveragerc
      # technique, dropping the omit for this step only.
      - name: Per-module coverage gate (demos)
        if: always() && hashFiles('tests/demos/') != ''
        run: |
          cat > .coveragerc.demos <<'COVEOF'
          [run]
          branch = true

          [report]
          show_missing = true
          COVEOF
          pytest tests/demos/ \
            --cov=src/demos --cov-config=.coveragerc.demos \
            --cov-branch --cov-fail-under=81 -q --no-header

      # src/video_compression is globally omitted from the whole-repo --cov=src
      # gate above (`[tool.coverage.run] omit` in pyproject.toml) -- that omit
      # predates this package's current active status in the charter's scope
      # register (openspec/specs/project-charter/spec.md lists it under domain
      # "video") and was never revisited. A `--cov=src/video_compression` run
      # under the unmodified repo config would silently measure 0% ("Module
      # src/video_compression was never imported"), which is exactly the
      # false-pass failure mode a coverage gate must not have. The
      # inline-generated coveragerc override below is the same technique
      # .github/workflows/phase2-zoo-validation.yml already uses to solve the
      # identical collision for src/video_compression/zoo/ alone: it drops the
      # omit for this step only, leaving pyproject.toml and the global gate's
      # measured percentage untouched. Measured branch coverage 85.43%;
      # gated at 83 (floor(measured)-2).
      - name: Per-module coverage gate (video_compression)
        if: always() && hashFiles('tests/video_compression/') != ''
        run: |
          cat > .coveragerc.video-compression <<'COVEOF'
          [run]
          branch = true

          [report]
          show_missing = true
          COVEOF
          pytest tests/video_compression/ -m "not gpu_required" \
            --cov=src/video_compression --cov-config=.coveragerc.video-compression \
            --cov-branch --cov-fail-under=83 -q --no-header

      # dashboard/ lives outside src/, so the --cov=src run above measures none of it
      # even though the blanket `pytest tests/` executes its 214 tests. Gated at 84
      # against a measured 84.85%: tabs/game_tab.py sits at 53% because _ensure_loaded
      # is the hf_space-shadowed import path that tests/dashboard/conftest.py must mock.
      # Raising this to 85 is tracked as a WS3 task -- relocating those modules is what
      # makes that code testable. --cov-fail-under overrides [tool.coverage.report]
      # fail_under=85 in pyproject.toml, as the src/distributed gate at 60 demonstrates.
      - name: Per-module coverage gate (dashboard)
        if: always() && hashFiles('tests/dashboard/') != ''
        run: |
          pytest tests/dashboard/ --cov=dashboard --cov-branch --cov-fail-under=84 -q --no-header

  # ============================================================
  # Stage 6: JAX Backend Tests
  # ============================================================
  test-jax:
    name: JAX Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jax]"

      - name: Run JAX-specific tests
        run: |
          pytest tests/backend/ \
            --tb=short \
            -q

      - name: Run cross-backend tests
        run: |
          pytest tests/ \
            -m "cross_backend" \
            --tb=short \
            -q

  # ============================================================
  # Stage 7: Chess Pipeline Tests
  # ============================================================
  test-chess:
    name: Chess Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run chess unit tests
        run: |
          pytest tests/games/test_chess.py tests/games/test_chess_exhaustive.py \
            tests/games/test_wrapper.py tests/modeling/test_chess_model.py \
            tests/training/test_chess_self_play.py \
            tests/training/test_trainer_chess.py \
            tests/security/test_chess_security.py \
            --cov=src/games \
            --cov-config=.github/chess-coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --tb=short \
            -v

      - name: Run chess E2E smoke tests
        run: |
          pytest tests/e2e/test_chess_training_e2e.py \
            --tb=short \
            -v

  # ============================================================
  # Stage 8: Optional-dependency test suites
  # ------------------------------------------------------------
  # These suites used pytest.importorskip and skipped SILENTLY in the default
  # matrix because their deps are not in [dev]. Installing [test-extras] makes
  # them actually execute (FEM baseline, ONNX export/validate, PettingZoo)
  # instead of masking those paths as "passing".
  # ============================================================
  test-extras:
    name: Optional-Dependency Suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # eval-harness included for the same reason as test-extras: without it
          # 8 of the 11 modules under tests/integrations/eval_harness/ skip at
          # import, masking ~900 LOC as "passing". This job exists to stop
          # exactly that.
          pip install -e ".[dev,test-extras,eval-harness]"

      # Verified green locally with scikit-fem + pettingzoo installed.
      # ALPHAGALERKIN_REQUIRE_EXTRAS=1 turns a fem_required test collected
      # without scikit-fem into a hard collection error rather than a silent
      # skip -- this job installs [test-extras] specifically so scikit-fem is
      # present; a half-succeeded install must not go quietly green here.
      - name: Run FEM baseline + PettingZoo suites
        env:
          ALPHAGALERKIN_REQUIRE_EXTRAS: "1"
        run: |
          pytest tests/research/test_fem_baseline.py \
            tests/research/test_skfem_substrate.py \
            tests/games/test_pettingzoo_adapter.py \
            --tb=short -q

      # src/research/substrates/skfem_tri.py is in pyproject.toml's global
      # [tool.coverage.run] omit (it needs the optional [fem] extra), so a bare
      # --cov of it reports 0.00% with "No data was collected" -- and this job,
      # the ONLY one with scikit-fem installed, previously ran no --cov at all.
      # The module's coverage was therefore measured nowhere and could not
      # regress-fail: exactly the false pass CLAUDE.md documents for
      # video_compression and demos. Same inline-coveragerc fix as those two,
      # dropping the omit for this step only. Directory (not file-path) --cov
      # spec: coverage 7.x silently drops --cov=<...>.py.
      #
      # Gate 95, deliberately above the usual "floor(measured)-2 capped at 85"
      # convention: the package is 272 statements at 99%, so an 85 gate would
      # carry 14 points of slack and reproduce the finding this step exists to
      # close.
      - name: Coverage gate (src/research/substrates, needs [fem])
        env:
          # Without scikit-fem the fem_required tests SKIP, the measured
          # percentage collapses, and the gate fails on "coverage too low" --
          # naming the symptom instead of the cause. This turns that into the
          # collection error it actually is.
          ALPHAGALERKIN_REQUIRE_EXTRAS: "1"
        run: |
          cat > .coveragerc.substrates <<'COVEOF'
          [run]
          branch = true

          [report]
          show_missing = true
          COVEOF
          pytest tests/research/test_skfem_substrate.py \
            tests/research/test_amr_arena_interpretability.py \
            tests/research/test_tensor_grid_substrate.py \
            tests/research/test_substrates_config.py \
            tests/research/test_substrates_sweep.py \
            --cov=src/research/substrates \
            --cov-config=.coveragerc.substrates \
            --cov-branch --cov-fail-under=95 -q --no-header

      # fem_baseline.py has the same problem for the same reason and had no gate
      # at all: it is in the global omit (needs [fem]), so the `coverage` job's
      # --cov=src/research gate at 85 has never measured it -- 249 statements
      # invisible inside a package percentage that looked fine. Native-runner
      # form because a --cov=<...>.py spec is silently dropped by coverage 7.x,
      # and --rcfile because `coverage run` reads pyproject.toml's omit too
      # (--include alone does NOT override it -- verified: "No data was
      # collected"). Gated at 83 = floor(measured 85) - 2.
      - name: Coverage gate (src/research/fem_baseline.py, needs [fem])
        env:
          # Without scikit-fem every test here skips and `coverage report`
          # fails with "No data was collected" -- true, but it reads like a
          # tooling fault rather than a missing extra.
          ALPHAGALERKIN_REQUIRE_EXTRAS: "1"
        run: |
          cat > .coveragerc.fem <<'COVEOF'
          [run]
          branch = true

          [report]
          show_missing = true
          COVEOF
          python -m coverage run --rcfile=.coveragerc.fem --branch \
            --include="*/src/research/fem_baseline.py" \
            -m pytest tests/research/test_fem_baseline.py \
            tests/research/test_skfem_substrate.py -q -p no:cov
          python -m coverage report --rcfile=.coveragerc.fem \
            --include="*/src/research/fem_baseline.py" --fail-under=83

      # The fem_required half of the E2E tier. `test-e2e` deliberately excludes
      # it (-m "not fem_required") because that job does not install [fem]; this
      # job is the only one that does. Selecting it POSITIVELY here is what stops
      # "excluded in both places" -- which is exactly how tests/e2e/ became
      # invisible in the first place, and is asserted by
      # tests/docs/test_e2e_visibility.py.
      #
      # ALPHAGALERKIN_REQUIRE_EXTRAS=1 for the same reason as the steps above: a
      # half-succeeded scikit-fem install must be a collection error here, not a
      # silent skip that reports green.
      - name: Run fem_required E2E journeys
        env:
          ALPHAGALERKIN_REQUIRE_EXTRAS: "1"
          E2E_DEVICE: cpu
        run: |
          pytest tests/e2e/ \
            -m "fem_required and not gpu_required" \
            --tb=short \
            -q

      # torch.onnx.export uses the dynamo exporter by default on torch>=2.9,
      # which these tracer-based tests do not target (src/deployment/export_onnx.py
      # does not pin dynamo=False). Kept non-blocking (continue-on-error) so the
      # suites RUN and their result is visible, without gating the pipeline on a
      # torch-version-default until export_onnx.py pins the legacy path.
      - name: Run ONNX export/validate suites
        continue-on-error: true
        run: |
          pytest tests/deployment/test_export_onnx_integration.py \
            tests/integration/test_onnx_e2e.py \
            --tb=short -q

  # ============================================================
  # Honest zero-shot transfer regression tripwire
  # ============================================================
  # Runs the CPU CI-tripwire config and diffs the stable headline metrics against the
  # committed baseline (config/baselines/transfer_ci.json). The job goes red on a gross
  # regression (direction-aware, 40% tolerance absorbs cross-runner BLAS drift), so a
  # broken operator/CNN arm is visible. It is reported SOFTLY in ci-success (not a hard
  # merge block) until its cross-runner stability is characterised — promote to a
  # required gate afterwards.
  transfer-baseline-regression:
    name: Transfer Baseline Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run CI-tripwire benchmark and diff vs committed baseline
        run: |
          python -m scripts.run_transfer_baseline_compare \
            --config config/scenarios/transfer_baseline_compare_ci.yaml \
            --baseline config/baselines/transfer_ci.json \
            --output-dir outputs/transfer_ci --log-level WARNING
      - name: Upload transfer benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transfer-baseline-results
          path: results/transfer_baseline_compare.*
          retention-days: 30

  # ============================================================
  # Final Status Check
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-fast, coverage, coverage-gates, test-extras, transfer-baseline-regression, test-integration, test-e2e, test-jax, test-chess]
    # !cancelled() rather than always(): a run superseded by the concurrency
    # group (push + pull_request for the same branch, or a newer push) has its
    # needed jobs cancelled, and under always() this job would still execute,
    # see result=cancelled, and report a spurious red X for a run nobody was
    # waiting on. Skipping on cancellation keeps the aggregate gate honest while
    # still running -- and failing -- whenever a needed job genuinely fails.
    if: ${{ !cancelled() }}

    steps:
      - name: Check required jobs passed
        run: |
          echo "=== CI Gate Results ==="
          echo "  lint:                        ${{ needs.lint.result }}"
          echo "  test-fast:                   ${{ needs.test-fast.result }}"
          echo "  coverage:                    ${{ needs.coverage.result }}"
          echo "  coverage-gates:              ${{ needs.coverage-gates.result }}"
          echo "  test-extras:                 ${{ needs.test-extras.result }}"
          echo "  test-integration:            ${{ needs.test-integration.result }}"
          echo "  test-e2e:                    ${{ needs.test-e2e.result }}"
          echo "  test-jax:                    ${{ needs.test-jax.result }}"
          echo "  test-chess:                  ${{ needs.test-chess.result }}"
          echo "  transfer-baseline (soft):    ${{ needs.transfer-baseline-regression.result }}"
          echo "======================="

          # Soft (informational) gate: report but do not block on the transfer
          # regression tripwire until its cross-runner stability is characterised.
          if [[ "${{ needs.transfer-baseline-regression.result }}" != "success" ]]; then
            echo "NOTE: transfer-baseline regression tripwire is non-green (soft, non-blocking)."
          fi

          # Required gates: lint must pass
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "FAIL: Lint & Type Check failed (result=${{ needs.lint.result }})"
            exit 1
          fi

          # test-fast must pass
          if [[ "${{ needs.test-fast.result }}" != "success" ]]; then
            echo "FAIL: Unit tests failed (result=${{ needs.test-fast.result }})"
            exit 1
          fi

          # Coverage gate is a hard threshold (--cov-fail-under=85)
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "FAIL: Coverage gate did not pass (result=${{ needs.coverage.result }})"
            exit 1
          fi

          # Per-module gates, split out of `coverage` on 2026-09-02. Gating them
          # here is not new strictness -- they were already hard gates inside the
          # coverage job, and omitting them from `needs` after the split would
          # have silently downgraded ~40 thresholds to advisory.
          if [[ "${{ needs.coverage-gates.result }}" != "success" ]]; then
            echo "FAIL: Per-module coverage gates did not pass (result=${{ needs.coverage-gates.result }})"
            exit 1
          fi

          # test-extras was NEVER in this list, so every gate it carries has been
          # unable to block a merge -- including the two [fem] gates added on
          # 2026-09-02 (src/research/substrates at 95, fem_baseline.py at 83) and
          # the FEM-baseline + PettingZoo suites that predate them. A gate that
          # cannot fail the build is a report, not a gate.
          if [[ "${{ needs.test-extras.result }}" != "success" ]]; then
            echo "FAIL: Optional-dependency suites failed (result=${{ needs.test-extras.result }})"
            exit 1
          fi

          # The three below were NEVER in `needs` (B38, 2026-09-02): hard-failing
          # jobs that ran on every PR with no `if:` and could not block a merge.
          # test-chess even carries its own --cov-fail-under=80 on src/games that
          # enforced nothing. focus/secrets stay out per their own comments;
          # test-slow stays out because it is PR-invisible by design.
          if [[ "${{ needs.test-integration.result }}" != "success" ]]; then
            echo "FAIL: Integration tests failed (result=${{ needs.test-integration.result }})"
            exit 1
          fi

          # test-e2e is blocking from its first day. The tier was excluded from
          # every step in this workflow but one, so its 81 tests gated nothing;
          # adding the job without adding it here would reproduce that exactly --
          # a job that runs, reports, and cannot fail the build.
          if [[ "${{ needs.test-e2e.result }}" != "success" ]]; then
            echo "FAIL: E2E journeys failed (result=${{ needs.test-e2e.result }})"
            exit 1
          fi

          if [[ "${{ needs.test-jax.result }}" != "success" ]]; then
            echo "FAIL: JAX backend tests failed (result=${{ needs.test-jax.result }})"
            exit 1
          fi

          if [[ "${{ needs.test-chess.result }}" != "success" ]]; then
            echo "FAIL: Chess pipeline tests failed (result=${{ needs.test-chess.result }})"
            exit 1
          fi

          echo "All core CI gates passed"
