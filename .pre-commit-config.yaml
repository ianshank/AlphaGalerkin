# AlphaGalerkin Pre-commit Configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

default_language_version:
  python: python3.11

# Define shared settings
default_stages: [pre-commit]

# NOTE: hf_space/ exclusions are applied PER-HOOK (ruff, ruff-format, yamllint),
# not as a top-level `exclude:`. A top-level exclude is inherited by every hook,
# which would also disable `detect-private-key` and `check-added-large-files` on
# hf_space/ — the one tree in this repo that is published to a public
# HuggingFace Space, and which already carries a 7.2 MB checkpoint.pt (7x the
# --maxkb=1000 limit). Those two hooks must stay global; only the style/lint
# hooks need the exclusion (the mirror is pinned to an older ruff/gradio and is
# an accepted charter deviation — see the ci.yml lint job).

repos:
  # =============================================================
  # General file quality
  # =============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags for Hydra configs
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      # check-docstring-first is deliberately absent: 21 modules repo-wide
      # (20 under src/ — src/constants.py, the stochastic package, most scenario
      # configs, ... — plus tests/e2e/test_chess_engine_e2e.py) use PEP 258-style
      # attribute docstrings: a string literal documenting the assignment above
      # it. The hook misreads those as "multiple module docstrings" and rejects
      # the file. A per-file `exclude:` was considered but would need all 21
      # paths enumerated and kept in sync; the idiom is the house style here, so
      # the hook is the thing that does not fit.
      - id: debug-statements
      - id: check-ast

  # =============================================================
  # Python code formatting with Ruff
  # =============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep aligned with the `ruff==0.15.8` pin in pyproject.toml [dev] and
    # .github/workflows/ci.yml — otherwise pre-commit reformats code differently
    # from the CI `ruff format --check` gate.
    rev: v0.15.8
    hooks:
      # Run the Ruff linter (replaces flake8, isort, etc.)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^(hf_space|notebooks|claude-code-platform)/
      # Run the Ruff formatter (replaces black)
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^(hf_space|notebooks|claude-code-platform)/

  # =============================================================
  # Type checking with MyPy (optional, can be slow)
  # =============================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    # Aligned with the `mypy>=1.10,<1.12` pin in pyproject.toml [dev] / ci.yml.
    rev: v1.11.2
    hooks:
      - id: mypy
        args:
          - --strict
          - --ignore-missing-imports
          - --no-error-summary
        additional_dependencies:
          - torch
          - pydantic
          - numpy
          - types-PyYAML
        # Only check staged files to keep it fast
        pass_filenames: true
        # Skip in CI (handled by dedicated job)
        stages: [manual]

  # =============================================================
  # Commit message validation
  # =============================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.14.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # =============================================================
  # Jupyter notebook cleanup
  # =============================================================
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        args: [--keep-output]  # Keep output for reproducibility

  # =============================================================
  # YAML/Hydra config validation
  # =============================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.34.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        # Only if .yamllint.yaml exists
        files: \.ya?ml$
        exclude: ^hf_space/

  # =============================================================
  # Internal Markdown link check (offline, no network)
  # =============================================================
  - repo: local
    hooks:
      - id: check-doc-links
        name: check internal doc links
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: \.md$

# =============================================================
# CI-only configuration
# =============================================================
ci:
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip:
    - mypy  # Too slow for pre-commit.ci
