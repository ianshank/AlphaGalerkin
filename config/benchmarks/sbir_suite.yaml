# SBIR Benchmark Suite
# Comprehensive benchmark configuration for SBIR proposal demonstrations.
# Runs all 3 core benchmark problems with classical baselines.

suite_name: "sbir_benchmarks"
description: "AlphaGalerkin SBIR readiness benchmark suite"
output_dir: "outputs/sbir_benchmarks"

benchmarks:
  # Benchmark 1: L-shaped Poisson (AMR demonstration)
  - name: "poisson_lshaped"
    pde_type: "poisson"
    geometry: "l_shaped"
    description: "Poisson equation on L-shaped domain with reentrant corner singularity"
    exact_solution: "r^(2/3) * sin(2*theta/3)"
    domain:
      geometry_type: "l_shaped"
      scale: 1.0
    parameters:
      # Not read either (see burgers_shock below); harmless only because it
      # happens to restate PDEConfig's own default.
      diffusion_coeff: 1.0
    refinement_levels: [4, 8, 16, 32, 64, 128]
    # Opt-in via `run_sbir_demo --heavy` (or PDEBenchmarkRunner(heavy=True)).
    # The 65 536-DOF level demonstrates the P40's 24 GiB VRAM advantage over
    # consumer 8 GiB cards. CI smoke tests run without --heavy.
    heavy_refinement_levels: [16384, 65536]
    target_error: 1.0e-6
    metrics:
      - "l2_error"
      - "h1_error"
      - "convergence_rate"
      - "dof_count"
      - "wall_time_seconds"

  # Benchmark 2: Burgers shock (nonlinear PDE)
  - name: "burgers_shock"
    pde_type: "burgers"
    geometry: "rectangular"
    description: "Viscous Burgers equation with shock formation"
    exact_solution: "cole_hopf_transform"
    domain:
      dim: 1
      min: [0.0]
      max: [1.0]
    parameters:
      # WARNING: this key is currently IGNORED. PDEBenchmarkRunner._create_operator
      # reads only `advection_coeff` out of `parameters`, so BurgersOperator is
      # always built at PDEConfig's default diffusion_coeff = 1.0, never at any
      # of the values listed here. The "Burgers shock" row has therefore never
      # run at a shock-forming viscosity. Wiring it through is NOT a one-line
      # change: BurgersOperator.exact_solution loses float64 significance below
      # COLE_HOPF_MIN_RESOLVED_VISCOSITY = 0.01 over the whole interval
      # x < arccos(2*pi*nu*ln(1/clamp_eps) - 1)/pi (~50% of the domain at
      # nu=0.005, ~80% at nu=0.001), so honouring 0.005/0.001 as written would
      # silently move the l2_error metric onto an unresolvable reference.
      # Needs scoping as its own change; see src/pde/operators.py.
      viscosity: [0.01, 0.005, 0.001]
      # `shock_position` removed: it named a BurgersOperator constructor
      # parameter that was deleted when the operator was pinned to the
      # homogeneous-Dirichlet Cole-Hopf benchmark (there is no shock offset to
      # position any more).
    time_stepping:
      method: "rk4"
      dt: 0.001
      t_final: 0.5
    target_error: 1.0e-4
    metrics:
      - "l2_error"
      - "shock_resolution"
      - "convergence_rate"
      - "wall_time_seconds"

  # Benchmark 3: Navier-Stokes Taylor-Green vortex
  - name: "navier_stokes_taylor_green"
    pde_type: "navier_stokes"
    geometry: "rectangular"
    description: "Taylor-Green vortex decay (2D incompressible NS)"
    exact_solution: "taylor_green_analytical"
    domain:
      dim: 2
      min: [0.0, 0.0]
      max: [6.283185307, 6.283185307]  # [0, 2*pi]^2
    parameters:
      # Also currently IGNORED, for the same reason as burgers_shock's
      # `viscosity` above: _create_operator consumes only `advection_coeff`.
      reynolds_number: [100, 200, 500]
    time_stepping:
      method: "rk4"
      dt: 0.01
      t_final: 1.0
    target_error: 1.0e-3
    metrics:
      - "velocity_l2_error"
      - "pressure_l2_error"
      - "continuity_residual"
      - "energy_dissipation_rate"
      - "wall_time_seconds"

baselines:
  # Classical FEM baselines
  - name: "uniform_fem"
    description: "Uniform mesh finite elements (no adaptivity)"
    type: "classical"

  - name: "dorfler_amr"
    description: "Dorfler marking adaptive mesh refinement"
    type: "classical"
    # marking_fraction inherits the AMRConfig default (0.5 post-2026-05-03).
    # Pre-fix the explicit 0.3 here forced the YAML-driven SBIR run to use
    # the conservative marking that produced the 18-DOF Burgers ceiling.
    # Override here only if a specific benchmark needs a different theta.

  - name: "zienkiewicz_zhu"
    description: "Zienkiewicz-Zhu error estimator with AMR"
    type: "classical"

  # ML baselines
  - name: "pinn"
    description: "Physics-Informed Neural Network"
    type: "ml"

  - name: "fno"
    description: "Fourier Neural Operator"
    type: "ml"

  - name: "physicsnemo_surrogate"
    description: "NVIDIA PhysicsNeMo surrogate model"
    type: "ml"

reporting:
  formats: ["json", "latex", "markdown"]
  figures:
    - "error_vs_dof"
    - "error_vs_walltime"
    - "convergence_rates"
    - "method_comparison_table"
